<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="Arc Vault — an auditable RWA collateral lending interface for Arc Testnet." />
    <link rel="icon" type="image/png" href="assets/arc-vault-mark_29501610.png" />
    <title>Arc Vault — Testnet Ledger</title>
    <script type="module" crossorigin src="/arc-vault/assets/index-BFUCyIIE.js"></script>
    <link rel="stylesheet" crossorigin href="/arc-vault/assets/index-CogQSK38.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const rewrite = (element) => {
          if (!(element instanceof HTMLImageElement)) return;
          const source = element.getAttribute("src");
          if (!source || !source.startsWith("/manus-storage/")) return;
          const fileName = source.split("/").pop();
          element.src = new URL(`assets/${fileName}`, document.baseURI).href;
        };
        new MutationObserver((records) => records.forEach((record) => record.addedNodes.forEach((node) => {
          if (node instanceof HTMLImageElement) rewrite(node);
          if (node instanceof HTMLElement) node.querySelectorAll("img").forEach(rewrite);
        }))).observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
